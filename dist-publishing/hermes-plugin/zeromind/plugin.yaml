name: zeromind
version: "0.7.0"
description: "ZeroMind — the shared library of published Zero engine worlds + assets, plus the engine you drive remotely. Contributes a skill and a slash command alongside the zeromind MCP server."
author: OrigoZero
provides_skills:
  - zeromind-getting-started
  - zeromind-library
provides_commands:
  - zeromind
requires_env:
  - name: ZEROMIND_INSTALL_SECRET
    description: "This machine's install secret, the bearer the mcp_servers.zeromind entry sends. Written by `zeromind link` into ~/.config/zero/session.json."
    secret: true
